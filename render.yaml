# Render Blueprint — deploys the API with the telematics pollers and trip
# detector. The dashboard is hosted on Vercel (frontend/vercel.json).
# Secrets are `sync: false`: Render asks for them on first deploy and they
# are never stored in this repository.
services:
  # Must run as ONE instance — two copies would split the Eicher
  # 1-request/min limit and make each other fail with 429s.
  - type: web
    name: bhushilp-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VECV_API_KEY_2
        sync: false
      - key: VOLVO_API_USERNAME
        sync: false
      - key: VOLVO_API_PASSWORD
        sync: false
      # The Vercel dashboard URL, e.g. https://fleet-management-system.vercel.app
      - key: CORS_ORIGIN
        sync: false
