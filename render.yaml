# Render Blueprint — deploys the API (with the telematics pollers) and the
# dashboard. Secrets are `sync: false`: Render asks for them on first deploy
# and they are never stored in this repository.
services:
  # Backend: Express API + Eicher/Volvo pollers + trip detector. Must run as
  # ONE instance — two copies would split the Eicher 1-request/min limit and
  # make each other fail with 429s.
  - type: web
    name: bhushilp-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: VECV_API_KEY_2
        sync: false
      - key: VOLVO_API_USERNAME
        sync: false
      - key: VOLVO_API_PASSWORD
        sync: false
      # The dashboard's URL, e.g. https://bhushilp-dashboard.onrender.com
      - key: CORS_ORIGIN
        sync: false

  # Frontend: static React build, served from Render's CDN (never sleeps).
  - type: web
    name: bhushilp-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # React Router: every path serves index.html so page refreshes work.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # The API's URL + /api, e.g. https://bhushilp-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
